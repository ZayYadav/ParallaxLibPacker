name: Secure package tests

on:
  push:
    branches:
      - main
      - ultra-multivm-hardening
    paths:
      - "scripts/**"
      - "tests/**"
      - "upx-devel/src/parallax_vm4.h"
      - ".github/workflows/secure-packages.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "upx-devel/src/parallax_vm4.h"
      - ".github/workflows/secure-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked security dependencies
        run: python -m pip install --only-binary=:all: -r scripts/requirements-secure.txt

      - name: Python security tests
        run: python -m unittest discover -s tests -v

      - name: PVM4 C round-trip vectors
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pvm4_roundtrip.c -o /tmp/pvm4-roundtrip
          /tmp/pvm4-roundtrip
