name: Secure package tests
on:
  push:
    paths: ['scripts/**', 'tests/**', '.github/workflows/secure-packages.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/secure-packages.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --only-binary=:all: -r scripts/requirements-secure.txt
      - run: python -m unittest discover -s tests -v
