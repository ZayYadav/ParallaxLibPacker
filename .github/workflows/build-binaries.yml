name: Build ParallaxLibPacker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "upx-devel/**"
      - ".github/workflows/build-binaries.yml"

permissions:
  contents: read

env:
  SOURCE_DIR: upx-devel

jobs:
  build-linux:
    name: Linux x64 compact
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils cmake ninja-build git file

      - name: Download required vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"
          clone_vendor() {
            local repo="$1" dst="$2"
            if [ ! -d "$SOURCE_DIR/vendor/$dst/.git" ]; then
              git clone --depth 1 --branch upx-vendor "https://github.com/upx/$repo.git" "$SOURCE_DIR/vendor/$dst"
            fi
          }
          clone_vendor upx-vendor-doctest doctest
          clone_vendor upx-vendor-lzma-sdk lzma-sdk
          clone_vendor upx-vendor-ucl ucl
          clone_vendor upx-vendor-valgrind valgrind
          clone_vendor upx-vendor-zlib zlib

      - name: Configure compact Linux build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_RELEASE="-Os -DNDEBUG -ffunction-sections -fdata-sections -flto" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Os -DNDEBUG -ffunction-sections -fdata-sections -flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto -Wl,--gc-sections -Wl,--as-needed" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_TEST=ON

      - name: Build Linux
        run: cmake --build build-linux --config Release --parallel

      - name: Strip and self-pack Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW="build-linux/upx"
          FINAL="dist/ParallaxLibPacker-linux-x64"

          echo "Raw Linux binary:"
          ls -lh "$RAW"
          file "$RAW"
          ldd "$RAW" || true

          strip --strip-all "$RAW"
          "$RAW" --best --lzma -o "$FINAL" "$RAW"
          chmod +x "$FINAL"

          echo "Final Linux binary:"
          ls -lh "$FINAL"
          file "$FINAL"
          "$FINAL" --version

          BYTES=$(stat -c%s "$FINAL")
          echo "Final Linux size: ${BYTES} bytes"
          if [ "$BYTES" -gt 921600 ]; then
            echo "ERROR: Linux binary is larger than 900 KiB."
            exit 1
          fi

          sha256sum "$FINAL" > "${FINAL}.sha256"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxLibPacker-Linux-x64
          path: |
            dist/ParallaxLibPacker-linux-x64
            dist/ParallaxLibPacker-linux-x64.sha256
          compression-level: 9
          if-no-files-found: error

  build-windows:
    name: Windows x64 compact
    runs-on: ubuntu-22.04
    needs: build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install x64 MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            cmake \
            ninja-build \
            git \
            file

      - name: Download required vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"
          clone_vendor() {
            local repo="$1" dst="$2"
            if [ ! -d "$SOURCE_DIR/vendor/$dst/.git" ]; then
              git clone --depth 1 --branch upx-vendor "https://github.com/upx/$repo.git" "$SOURCE_DIR/vendor/$dst"
            fi
          }
          clone_vendor upx-vendor-doctest doctest
          clone_vendor upx-vendor-lzma-sdk lzma-sdk
          clone_vendor upx-vendor-ucl ucl
          clone_vendor upx-vendor-valgrind valgrind
          clone_vendor upx-vendor-zlib zlib

      - name: Download Linux host packer
        uses: actions/download-artifact@v4
        with:
          name: ParallaxLibPacker-Linux-x64
          path: host-packer

      - name: Prepare host packer
        shell: bash
        run: |
          chmod +x host-packer/ParallaxLibPacker-linux-x64
          host-packer/ParallaxLibPacker-linux-x64 --version

      - name: Configure Windows x64 MinGW build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-windows \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS_RELEASE="-Os -DNDEBUG -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Os -DNDEBUG -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--gc-sections -s" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_TEST=ON \
            -DUPX_CONFIG_CMAKE_DISABLE_PLATFORM_CHECK=ON

      - name: Build Windows x64
        run: cmake --build build-windows --config Release --parallel

      - name: Strip and pack Windows binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW="build-windows/upx.exe"
          FINAL="dist/ParallaxLibPacker-windows-x64.exe"

          if [ ! -f "$RAW" ]; then
            RAW=$(find build-windows -type f -iname 'upx.exe' | head -n 1)
          fi
          if [ -z "${RAW:-}" ] || [ ! -f "$RAW" ]; then
            echo "ERROR: Windows upx.exe was not produced."
            exit 1
          fi

          echo "Raw Windows binary:"
          ls -lh "$RAW"
          file "$RAW"

          x86_64-w64-mingw32-strip --strip-all "$RAW"

          echo "After strip:"
          ls -lh "$RAW"

          host-packer/ParallaxLibPacker-linux-x64 \
            --best --lzma \
            -o "$FINAL" \
            "$RAW"

          echo "Final Windows binary:"
          ls -lh "$FINAL"
          file "$FINAL"

          BYTES=$(stat -c%s "$FINAL")
          echo "Final Windows size: ${BYTES} bytes"
          if [ "$BYTES" -gt 1572864 ]; then
            echo "ERROR: Windows binary is larger than 1.5 MiB."
            exit 1
          fi

          sha256sum "$FINAL" > "${FINAL}.sha256"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxLibPacker-Windows-x64
          path: |
            dist/ParallaxLibPacker-windows-x64.exe
            dist/ParallaxLibPacker-windows-x64.exe.sha256
          compression-level: 9
          if-no-files-found: error
