name: Secure package tests
on:
  push:
    paths: ['scripts/**', 'tests/**', 'upx-devel/src/parallax_vm4.h', '.github/workflows/secure-packages.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'upx-devel/src/parallax_vm4.h', '.github/workflows/secure-packages.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked security dependencies
        run: python -m pip install --only-binary=:all: -r scripts/requirements-secure.txt
      - name: Python security tests
        run: python -m unittest discover -s tests -v
      - name: PVM4 C round-trip vectors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/pvm4_roundtrip.c -o /tmp/pvm4-roundtrip
          /tmp/pvm4-roundtrip
