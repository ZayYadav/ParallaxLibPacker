name: Secure package tests
on:
  push:
    paths: ['scripts/parallax_package.py', 'scripts/requirements-secure.txt', 'tests/**', '.github/workflows/secure-packages.yml']
  pull_request:
    paths: ['scripts/parallax_package.py', 'scripts/requirements-secure.txt', 'tests/**', '.github/workflows/secure-packages.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-secure.txt
      - run: python -m unittest discover -s tests -v
