name: Build ParallaxLibPacker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "upx-devel/**"
      - ".github/workflows/build-binaries.yml"

permissions:
  contents: read

env:
  SOURCE_DIR: upx-devel

jobs:
  build-linux:
    name: Linux x64 compact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cmake \
            ninja-build \
            git \
            file

      - name: Download vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR/vendor"

          clone_vendor() {
            local repo="$1"
            local dst="$2"
            if [ ! -d "$SOURCE_DIR/vendor/$dst/.git" ]; then
              git clone --depth 1 --branch upx-vendor \
                "https://github.com/upx/$repo.git" \
                "$SOURCE_DIR/vendor/$dst"
            fi
          }

          clone_vendor upx-vendor-bzip2 bzip2
          clone_vendor upx-vendor-doctest doctest
          clone_vendor upx-vendor-lzma-sdk lzma-sdk
          clone_vendor upx-vendor-ucl ucl
          clone_vendor upx-vendor-valgrind valgrind
          clone_vendor upx-vendor-zlib zlib
          clone_vendor upx-vendor-zstd zstd

      - name: Configure size optimized Linux build
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S "$SOURCE_DIR" \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG -ffunction-sections -fdata-sections -flto" \
            -DCMAKE_CXX_FLAGS_MINSIZEREL="-Os -DNDEBUG -ffunction-sections -fdata-sections -flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -flto -Wl,--gc-sections" \
            -DUPX_CONFIG_DISABLE_GITREV=ON \
            -DUPX_CONFIG_DISABLE_SANITIZE=ON \
            -DUPX_CONFIG_DISABLE_WERROR=ON \
            -DUPX_CONFIG_DISABLE_WSTRICT=ON

      - name: Build Linux
        run: cmake --build build-linux --config MinSizeRel --parallel

      - name: Strip and self-pack Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          RAW="build-linux/upx"
          FINAL="dist/ParallaxLibPacker-linux-x64"

          echo "Raw binary:"
          ls -lh "$RAW"
          file "$RAW"

          strip --strip-all "$RAW"

          echo "After strip:"
          ls -lh "$RAW"

          "$RAW" --best --lzma -o "$FINAL" "$RAW"
          chmod +x "$FINAL"

          echo "Final packed binary:"
          ls -lh "$FINAL"
          file "$FINAL"
          "$FINAL" --version

          BYTES=$(stat -c%s "$FINAL")
          echo "Final Linux size: ${BYTES} bytes"

          if [ "$BYTES" -gt 1572864 ]; then
            echo "ERROR: Linux binary is larger than 1.5 MiB; refusing artifact upload."
            exit 1
          fi

          sha256sum "$FINAL" > "${FINAL}.sha256"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxLibPacker-Linux-x64
          path: |
            dist/ParallaxLibPacker-linux-x64
            dist/ParallaxLibPacker-linux-x64.sha256
          compression-level: 9
          if-no-files-found: error

  build-windows:
    name: Windows x64 compact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download vendor dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:SOURCE_DIR/vendor" | Out-Null

          function Clone-Vendor([string]$repo, [string]$dst) {
            $path = "$env:SOURCE_DIR/vendor/$dst"
            if (-not (Test-Path "$path/.git")) {
              git clone --depth 1 --branch upx-vendor "https://github.com/upx/$repo.git" $path
              if ($LASTEXITCODE -ne 0) { throw "Failed to clone $repo" }
            }
          }

          Clone-Vendor "upx-vendor-bzip2" "bzip2"
          Clone-Vendor "upx-vendor-doctest" "doctest"
          Clone-Vendor "upx-vendor-lzma-sdk" "lzma-sdk"
          Clone-Vendor "upx-vendor-ucl" "ucl"
          Clone-Vendor "upx-vendor-valgrind" "valgrind"
          Clone-Vendor "upx-vendor-zlib" "zlib"
          Clone-Vendor "upx-vendor-zstd" "zstd"

      - name: Configure size optimized Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Do not hard-code Visual Studio 2022. windows-latest currently ships
          # newer Visual Studio images, so let CMake choose the installed VS.
          cmake `
            -S "$env:SOURCE_DIR" `
            -B build-windows `
            -A x64 `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DUPX_CONFIG_DISABLE_GITREV=ON `
            -DUPX_CONFIG_DISABLE_SANITIZE=ON `
            -DUPX_CONFIG_DISABLE_WERROR=ON `
            -DUPX_CONFIG_DISABLE_WSTRICT=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-pack Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $binary = Get-ChildItem -Path "build-windows" -Filter "upx.exe" -File -Recurse |
            Where-Object { $_.FullName -match "Release" } |
            Select-Object -First 1

          if (-not $binary) {
            throw "Release upx.exe build output not found"
          }

          $final = Join-Path $PWD "dist/ParallaxLibPacker-windows-x64.exe"

          Write-Host "Raw Windows binary: $($binary.Length) bytes"

          & $binary.FullName --best --lzma -o $final $binary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Windows self-pack failed"
          }

          $packed = Get-Item $final
          Write-Host "Final Windows size: $($packed.Length) bytes"

          & $final --version
          if ($LASTEXITCODE -ne 0) {
            throw "Packed Windows binary failed version test"
          }

          if ($packed.Length -gt 2097152) {
            throw "Windows binary is larger than 2 MiB; refusing artifact upload"
          }

          $hash = Get-FileHash $final -Algorithm SHA256
          "$($hash.Hash.ToLower())  ParallaxLibPacker-windows-x64.exe" |
            Set-Content -Encoding ascii "dist/ParallaxLibPacker-windows-x64.exe.sha256"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxLibPacker-Windows-x64
          path: |
            dist/ParallaxLibPacker-windows-x64.exe
            dist/ParallaxLibPacker-windows-x64.exe.sha256
          compression-level: 9
          if-no-files-found: error
